spring:
  application:
    name: event-memories-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/event_memories}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 300MB
  web:
    error:
      include-message: never
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
  security:
    jwt-secret: ${JWT_SECRET:change-this-development-secret-change-this-32bytes}
    jwt-ttl: ${JWT_TTL:PT8H}
    cookie-secure: ${COOKIE_SECURE:false}
    visitor-hash-secret: ${VISITOR_HASH_SECRET:change-this-visitor-hash-secret}
  upload:
    max-image-bytes: ${MAX_IMAGE_BYTES:15728640}
    max-video-bytes: ${MAX_VIDEO_BYTES:262144000}
    max-files-per-request: ${MAX_FILES_PER_UPLOAD:20}
    image-mime-types: [image/jpeg, image/png, image/webp]
    video-mime-types: [video/mp4, video/quicktime]
    signed-url-ttl: ${SIGNED_URL_TTL:PT10M}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-root: ${LOCAL_STORAGE_ROOT:./data/storage}
    public-base-url: ${PUBLIC_API_BASE_URL:http://localhost:8080}
    r2-account-id: ${R2_ACCOUNT_ID:}
    r2-access-key-id: ${R2_ACCESS_KEY_ID:}
    r2-secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    r2-bucket: ${R2_BUCKET:}
  scanning:
    enabled: ${MALWARE_SCAN_ENABLED:false}
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    timeout: ${CLAMAV_TIMEOUT:PT2M}
  processing:
    core-threads: ${MEDIA_PROCESSING_CORE_THREADS:4}
    max-threads: ${MEDIA_PROCESSING_MAX_THREADS:10}
    queue-capacity: ${MEDIA_PROCESSING_QUEUE_CAPACITY:500}
    recovery-batch-size: ${MEDIA_PROCESSING_RECOVERY_BATCH_SIZE:100}
    recovery-delay-ms: ${MEDIA_PROCESSING_RECOVERY_DELAY_MS:60000}
  retention:
    default-days-after-expiry: ${MEDIA_RETENTION_DAYS:14}
    warning-days-before-delete: ${MEDIA_RETENTION_WARNING_DAYS:3}
    max-deletion-attempts: ${MEDIA_RETENTION_MAX_DELETE_ATTEMPTS:10}
  rate-limit:
    public-mutations-per-minute: ${PUBLIC_MUTATIONS_PER_MINUTE:60}
    login-attempts-per-five-minutes: ${LOGIN_ATTEMPTS_PER_5_MINUTES:10}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}
