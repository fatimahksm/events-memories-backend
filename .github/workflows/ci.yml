name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: event_memories
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ensure ffmpeg is available (video transcoding tests need it)
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version

      - name: Run tests
        env:
          DB_URL: jdbc:postgresql://localhost:5432/event_memories
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ci-test-secret-please-change-1234567890123456
          BOOTSTRAP_ADMIN_EMAIL: admin@brava.test
          BOOTSTRAP_ADMIN_PASSWORD: CiTestPass123!
          FRONTEND_URL: http://localhost:3100
          CORS_ORIGINS: http://localhost:3100
        run: mvn -B test

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7
